# zabbix-installer — Nginx public script endpoint
# ─────────────────────────────────────────────────────────────────────────────
# Makes  GET /zabbix/zabbix.php?action=zabbix-installer.script  publicly
# accessible WITHOUT a Zabbix session.
#
# How it works:
#   Nginx intercepts the exact URL before PHP-FPM is involved, rewrites it to
#   the static .sh file, and serves it directly.  No PHP, no Zabbix auth check.
#
# Where to add this:
#   Append the two location blocks below into your Zabbix server{} block, e.g.
#   /etc/nginx/conf.d/zabbix.conf  — BEFORE the existing PHP location block.
#
# After editing, test and reload:
#   nginx -t && systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────

# 1. Intercept zabbix.php only when action=zabbix-installer.script.
#    Exact match (=) has higher priority than the regex PHP location.
#    NOTE: if your Zabbix is at the root (no /zabbix/ prefix) change the path
#    from /zabbix/zabbix.php → /zabbix.php and adjust the rewrite target below.
location = /zabbix/zabbix.php {
    if ($arg_action = "zabbix-installer.script") {
        # Rewrite to the static file; Nginx re-evaluates locations (last).
        rewrite ^ /zabbix/modules/zabbix-installer/install-zabbix.sh last;
    }

    # All other zabbix.php requests continue to PHP-FPM as normal.
    # ── copy fastcgi params from your existing PHP location block: ──────────
    fastcgi_pass   unix:/run/php/php8.3-fpm.sock;   # adjust if needed
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include        fastcgi_params;
}

# 2. Serve the .sh file with the correct Content-Type (text/plain).
#    Without this, some Nginx builds default to application/x-sh which can
#    confuse older curl / bash combinations.
location = /zabbix/modules/zabbix-installer/install-zabbix.sh {
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control no-store;
    # root must point to the parent of /zabbix/ — adjust if your alias differs
    root /usr/share/zabbix/ui;
}
